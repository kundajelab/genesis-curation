[project]
name = "genesis-curation"
version = "0.1.0"
description = "Plant metadata discovery, evidence-backed curation and human review"
requires-python = ">=3.14"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.scripts]
genesis = "genesis_curation.cli:main"

[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.14,<1", "ty>=0.0.30,<1"]

[tool.ruff]
line-length = 100
# Fixture inputs are reproduced byte-for-byte from their original sources.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
exclude = ["tests/fixtures"]

[tool.setuptools.package-data]
genesis_curation = ["contracts/schemas/*.json", "llm/schemas/*.json", "llm/prompts/*.txt", "curation/vocabularies/*.json", "web/assets/*", "web/assets/assets/*"]
