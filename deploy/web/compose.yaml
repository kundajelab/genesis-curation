name: ${GENESIS_PROJECT:-genesis-curation}
x-app: &app
  image: ${GENESIS_IMAGE:-genesis-curation:local}
  build:
    context: ../..
    dockerfile: deploy/web/Dockerfile
  user: "${GENESIS_UID:?}:${GENESIS_GID:?}"
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - ${GENESIS_RUNTIME:?}:${GENESIS_RUNTIME:?}
  environment:
    GENESIS_RUNTIME: ${GENESIS_RUNTIME:?}
    TMPDIR: ${GENESIS_RUNTIME:?}/tmp
    PYTHONDONTWRITEBYTECODE: "1"
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  app:
    <<: *app
    restart: unless-stopped
    command: [web, serve, --root, "${GENESIS_RUNTIME}/state", --providers, "${GENESIS_RUNTIME}/config/providers.json", --origin, "http://127.0.0.1:${GENESIS_PORT:-18765}", --port, "${GENESIS_PORT:-18765}", --dev]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${GENESIS_PORT:-18765}/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    restart: unless-stopped
    command: [web, worker, --root, "${GENESIS_RUNTIME}/state", --providers, "${GENESIS_RUNTIME}/config/providers.json"]
  cli:
    <<: *app
    profiles: [tools]
    stdin_open: true
    tty: true
    command: [--help]
