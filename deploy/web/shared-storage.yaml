# Optional shared storage for public archive snapshots. SQLite and secrets stay local.
services:
  app:
    environment:
      GENESIS_SHARED_ROOT: /shared
    volumes:
      - type: bind
        source: ${WEB_SHARED_ROOT:?}
        target: /shared
        bind:
          create_host_path: false
      - type: bind
        source: ${WEB_SHARED_ROOT:?}/source-snapshots
        target: /data/source-snapshots
        bind:
          create_host_path: false
  worker:
    environment:
      GENESIS_SHARED_ROOT: /shared
    volumes:
      - type: bind
        source: ${WEB_SHARED_ROOT:?}
        target: /shared
        bind:
          create_host_path: false
      - type: bind
        source: ${WEB_SHARED_ROOT:?}/source-snapshots
        target: /data/source-snapshots
        bind:
          create_host_path: false
