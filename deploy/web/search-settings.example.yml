use_default_settings:
  engines:
    keep_only:
      - google
      - bing
      - duckduckgo
      - brave
server:
  secret_key: REPLACE_WITH_RANDOM_SECRET
  limiter: false
  image_proxy: false
search:
  formats:
    - html
    - json
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: false
