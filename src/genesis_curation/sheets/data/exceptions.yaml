# Curated per-run decisions that the rules cannot make, each with its evidence. A listed run
# is left out with `reason` (checked right after the assay flags, so the reason is recorded
# even when a later rule would also leave the run out).
rna-seq:
  Arabidopsis_thaliana:
    - study: PRJNA1442195
      runs: [SRR37749405]
      reason: sample title reports contamination
      why: >-
        The sample note of COL4 ("control for 10X tpp-KO") reports contamination; found in a
        title scan of the kept runs (curation of 2026-11-17).
    - study: PRJNA1065151
      runs: [SRR27606461, SRR27606462]
      reason: "genotype: mutant / transgenic (sample alias names nramp1 or mdg3 nramp1)"
      why: >-
        BioSample aliases '-Mn n1' (nramp1) and '-Mn mdg3n1'; study title 'RNA-seq of
        Arabidopsis mutant mdg3nramp1 and nramp1'; SRR27606461 has the same reads as SRR27557211
        (-Mn nramp1). Found in the review of the regenerated gold (2026-11-23).
    - study: PRJNA1025919
      runs: [SRR26349345, SRR26349346, SRR26349347]
      reason: "genotype: mutant / transgenic (sample alias names mta)"
      why: >-
        sample alias 'mta Control N'. Found in the review of the regenerated gold (2026-11-23).
    - study: PRJNA729190
      runs: [SRR14520149, SRR14520155, SRR14520156, SRR14520157, SRR14520158, SRR14520159,
        SRR14520160, SRR14520162, SRR14520163, SRR14520164, SRR14520165, SRR14520166,
        SRR14520167, SRR14520168, SRR14520169, SRR14520170, SRR14520171, SRR14520173,
        SRR14520174, SRR14520175, SRR14520176, SRR14520177, SRR14520178, SRR14520179,
        SRR14520180, SRR14520181, SRR14520182]
      reason: "genotype: mutant / transgenic (sample alias names arr1, arr12 or arr1/12)"
      why: >-
        sample aliases 'arr1 ...', 'arr12 ...', 'arr1/12 ...' beside 'col ...'. Found in the
        review of the regenerated gold (2026-11-23).
    - study: PRJNA867415
      runs: [SRR20971310, SRR20971311]
      reason: "genotype: mutant / transgenic (max2 mutant, sample alias M_*)"
      why: >-
        study 'RNA-seq of arabdopsis: max2'; aliases M_* beside WT_*. Found in the review of the
        regenerated gold (2026-11-23).
    - study: PRJNA1000649
      runs: [SRR25470092, SRR25470093, SRR25470094]
      reason: "genotype: mutant / transgenic (sample alias OE-E2Fa-DPa or CDJ)"
      why: >-
        aliases OE-E2Fa-DPa-N (overexpression) and CDJ-N beside WT-N. Found in the review of the
        regenerated gold (2026-11-23).
    - study: PRJNA602051
      runs: [SRR10915473, SRR10915474, SRR10915475, SRR10915476, SRR10915477, SRR10915478]
      reason: "genotype: not stated (one sample for wild type and atabcg14)"
      why: >-
        all 6 runs share BioSample SAMN13880679, alias 'wild type and atabcg14'. Found in the
        review of the regenerated gold (2026-11-23).
    - study: PRJNA843332
      runs: [SRR19440484, SRR19440493, SRR19440494, SRR19440495, SRR23970367]
      reason: "not standard RNA-seq (subcellular fraction)"
      why: >-
        aliases CB_N (chromatin-bound), 'Nuc.' (nuclear polyA), nuclear_RNA. Found in the review
        of the regenerated gold (2026-11-23).
    - study: PRJEB28655
      runs: [ERR2796349, ERR2796350, ERR2796351, ERR2796352, ERR2796353]
      reason: "genotype: mutant / transgenic (L5 transgenic line)"
      why: >-
        aliases 'L5 ...': the L5 line carries a silenced 35S-GUS transgene. Found in the review
        of the regenerated gold (2026-11-23).
    - study: PRJDB33703
      runs: [DRR744973, DRR744974, DRR744975]
      reason: "genotype: mutant / transgenic (pER8-LEC2 inducible line; Mock is the same line)"
      why: >-
        titles pER8-LEC2-RN and Mock-RN (study: LEC2 induces somatic embryogenesis). Found in
        the review of the regenerated gold (2026-11-23).
    - study: PRJNA1064056
      runs: [SRR27533219, SRR27533220, SRR27533221]
      reason: "genotype: mutant / transgenic (protoplasts expressing GmWRI1)"
      why: >-
        titles 'Ath, protoplast, GmWRI1, brN'. Found in the review of the regenerated gold
        (2026-11-23).
    - study: PRJNA625276
      runs: [SRR11544629, SRR11544630, SRR11544631, SRR11544632, SRR11544637, SRR11544638]
      reason: "genotype: mutant / transgenic (GVG-NtMEK2DD and CPK5-VK inducible lines)"
      why: >-
        aliases DD_* and CPK5-VK_*. Found in the review of the regenerated gold (2026-11-23).
    - study: PRJNA1199402
      runs: [SRR32019145]
      reason: "genotype: mutant / transgenic (TYDC-THT transgenic line)"
      why: >-
        title 'Col-0 TYDC-THT-1.3 transcriptome'. Found in the review of the regenerated gold
        (2026-11-23).
  Sorghum_bicolor:
    - study: PRJNA302593
      runs: [SRR2924917, SRR2924918]
      reason: "genotype: hybrid BTx623 x Y49"
      why: >-
        BioSample cultivar BTx623_Y49 and experiment titles "Sorghum hybrid BTx623*Y49
        endosperm" (reciprocal crosses); the study's BTx623 runs stay. Found by the model
        review of 2026-11-19.
atac-seq:
  Sorghum_bicolor:
    - study: CRA002789
      runs: [CRR145290]
      reason: low FRiP in a full pipeline run (0.066)
      why: >-
        The full atac-seq run (genesis-preprocessing test sheets, 2026-11-17) gave FRiP 0.066
        with TSS enrichment 2.69; the 200k-pair check passes it (TSS enrichment 2.30). The
        peak-free proxy does not separate it either: its share of cut sites near TSSs is 1.44
        times the input control's, while A. thaliana CRR804239 (FRiP 0.17 in a full run) has
        1.27 times the gDNA control's. The study's other three runs look the same on 200k
        pairs and have no full run, so they stay in the sheet.
