[workspace]
name = "genesis-method-benchmarks"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# This environment is separate from the installed Genesis runtime.
# The lock file records the exact builds used in a comparison.
[dependencies]
python = "3.12.*"
bwa-mem2 = "2.3.*"
bwa = "0.7.19.*"
bowtie2 = "2.5.*"
samtools = "1.24.*"
bedtools = "2.31.*"
macs3 = "3.0.5.*"
genrich = "0.6.*"
cutadapt = "5.*"
fastp = "1.*"
picard = "3.5.*"
matplotlib-base = "3.*"
pybigwig = "0.3.*"
pysam = "0.24.*"
deeptools = "3.5.6.*"

[feature.legacy.dependencies]
python = "3.11.*"

# Build the upstream release for this environment. The Bioconda build has an
# unresolved __log_finite symbol on this host (bioconda-recipes issue #59362).
[feature.legacy.pypi-dependencies]
macs2 = "==2.2.9.1"

[environments]
default = { features = [], solve-group = "current" }
macs2 = { features = ["legacy"], no-default-feature = true }
