# Known traps from earlier curation rounds. Each one is checked by `genesis sheets score`
# against the candidate sheet and runs-qc table for the same species and workflow.
# expect: included | excluded. Optional: reason_class (see sheets/score.py REASON_CLASSES)
# for excluded runs, fields (sheet values) for included runs.
traps:
  - id: dap-trimmed-uploads
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28539611, SRR35903219, SRR9702094]
    expect: excluded
    reason_class: files
    why: >-
      Reads were trimmed before upload (first 100 reads differ in length); the DAP
      workflow's METADATA step requires untrimmed reads (PRJNA1095882, PRJNA1354843, PRJNA551415).
  - id: dap-mates-in-two-runs
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28418942]
    expect: excluded
    reason_class: files
    why: >-
      Read 2 of the input SRR28418943 was uploaded as its own run; read names differ from
      read 1, so bwa refuses to pair them. The study runs single-end (PRJNA1090874).
  - id: dap-input-single-end
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28418943]
    expect: included
    fields: {layout: single}
    why: The input whose mate is a separate run is used single-end, with its treatments.
  - id: dap-days-after-pollination
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [ERR17427126]
    expect: excluded
    reason_class: assay
    why: '"DAP" in the title means days after pollination, not DNA affinity purification.'
  - id: scatac-interleaved-instruments
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR38507144, SRR38507142]
    expect: excluded
    reason_class: files
    why: >-
      Each SRA run interleaves MiSeq and NovaSeq reads whose barcodes read in opposite
      orientations; the workflow sets one orientation from the first reads (SRP699388).
  - id: rna-paired-served-as-one-file
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR20079009, SRR20079006]
    expect: excluded
    reason_class: files
    why: ENA lists the run as PAIRED but serves one file holding both mates in two blocks.
  - id: rna-single-cell-in-bulk
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR9618710]
    expect: excluded
    reason_class: assay
    why: Labelled RNA-Seq, but read 1 holds only the cell barcode.
  - id: rna-other-assays-behind-underscores
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR12272506, SRR26414733]
    expect: excluded
    reason_class: assay
    why: >-
      QuantSeq and m6A IP runs whose titles put the assay after an underscore; a `\b`
      regex misses them (underscore is a word character).
  - id: rna-smar2c2-labelled-rna-seq
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR18098724, SRR18098725, SRR18098726, SRR18098727]
    expect: excluded
    reason_class: assay
    why: Smar2C2 TSS libraries submitted as RNA-Seq.
  - id: rna-duplicate-submissions
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR26087269, SRR26087270]
    expect: excluded
    reason_class: duplicate
    why: Same reads as SRR26087205 and SRR26087208, submitted twice.
  - id: atac-low-frip-gsa
    species: Sorghum_bicolor
    workflow: atac-seq
    runs: [CRR145290]
    expect: excluded
    reason_class: qc
    why: >-
      FRiP 0.07 in a full Perlmutter run (TSS enrichment 2.3 on 200k pairs passed the
      metadata-stage cutoff). Gold 2026-11-17 still includes it; the test sheet dropped it.
  - id: rna-duplicate-keeps-earliest
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR10915190, SRR12426570, SRR28087964]
    expect: excluded
    reason_class: duplicate
    why: >-
      Resubmissions of SRR7447253, SRR8352559 and SRR5040384 (same read count and first reads).
      The earliest accession by number is kept; a string sort keeps SRR10915190 instead.
  - id: rna-duplicate-original-kept
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR7447253, SRR8352559, SRR5040384]
    expect: included
    why: The first submission of each duplicated library stays in the sheet.
  - id: rna-study-title-names-mutants
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR27054271]
    expect: included
    why: >-
      The experiment title says "RNAseq of rog mutants" for the whole study, but the sample
      title (Col0_cont-rep3) names the reference; a study-level word does not flag the sample.
  - id: rna-10x-and-chromatin-in-titles
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR37749403, SRR3352580]
    expect: included
    why: >-
      "control for 10X tpp-KO" (a fold change, not 10x Genomics) and "chromatin interaction
      network" (the study topic, not chromatin-bound RNA) are bulk RNA-seq.
  - id: atac-photoperiod-is-not-treatment
    species: Arabidopsis_thaliana
    workflow: atac-seq
    runs: [ERR6351833, ERR6351834, ERR6351835]
    expect: included
    why: >-
      The sample protocol states the growth photoperiod ("16 hr light") and a kit name with
      "Index"; neither is a treatment (bare light/dark and "dex" inside a word misfire).
  - id: atac-treatment-only-in-sample-alias
    species: Arabidopsis_thaliana
    workflow: atac-seq
    runs: [SRR13131332, SRR13131333]
    expect: excluded
    reason_class: treatment
    why: >-
      Cold-treatment runs (PRJNA680653) whose titles say only "4C"; the sample alias
      (ATACseq_Cold_4C_Rep2) names the treatment.
  - id: atac-controls-and-single-cell
    species: Sorghum_bicolor
    workflow: atac-seq
    runs: [SRR8742452, SRR27500249, SRR27704580]
    expect: excluded
    reason_class: assay
    why: >-
      An input control (TSS enrichment 0.98), sci-ATAC plates and a single-cell library
      source inside the ENA ATAC-seq search.
  - id: atac-gsa-runs-from-tab
    species: Sorghum_bicolor
    workflow: atac-seq
    runs: [CRR145291, SRR5748780]
    expect: included
    fields: {layout: paired}
    why: >-
      Runs only the metadata-sheet tab lists: a GSA run (files on a GSA download server,
      mates named _f1/_r2) and an INSDC run submitted as Tn-Seq.
