# Known traps from earlier curation rounds. Each one is checked by `genesis sheets score`
# against the candidate sheet and runs-qc table for the same species and workflow.
# expect: included | excluded. Optional: reason_class (see sheets/score.py REASON_CLASSES)
# for excluded runs, fields (sheet values) for included runs.
traps:
  - id: dap-trimmed-uploads
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28539611, SRR35903219, SRR9702094]
    expect: excluded
    reason_class: files
    why: >-
      Reads were trimmed before upload (first 100 reads differ in length); the DAP
      workflow's METADATA step requires untrimmed reads (PRJNA1095882, PRJNA1354843, PRJNA551415).
  - id: dap-mates-in-two-runs
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28418942]
    expect: excluded
    reason_class: files
    why: >-
      Read 2 of the input SRR28418943 was uploaded as its own run; read names differ from
      read 1, so bwa refuses to pair them. The study runs single-end (PRJNA1090874).
  - id: dap-input-single-end
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28418943]
    expect: included
    fields: {layout: single}
    why: The input whose mate is a separate run is used single-end, with its treatments.
  - id: dap-days-after-pollination
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [ERR17427126]
    expect: excluded
    reason_class: assay
    why: '"DAP" in the title means days after pollination, not DNA affinity purification.'
  - id: dap-paired-treatment-single-end-control
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR28418941]
    expect: included
    fields: {layout: single, control: SRR28418943}
    why: >-
      MACS3 BAMPE needs the control's layout to match; a paired treatment whose input is
      single-end runs on read 1 only (PRJNA1090874).
  - id: dap-single-end-treatment-paired-control
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR18347438]
    expect: included
    fields: {layout: single, control: SRR18347487}
    why: >-
      A single-end treatment whose control is paired uses a read-1-only copy of that control
      (PRJNA817215, pIXHALO_Col-B_b).
  - id: dap-inputs-by-sequencing-batch
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR12341146, SRR12341140]
    expect: included
    why: >-
      PRJNA649293 has three inputs, one per sequencing batch (GEO "Input DNA for samples
      ..."); MYC4 takes AthDNAb, MYC2 rep 1 takes AthDNAa rep 1.
  - id: dap-numbered-replicates
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR23311122, SRR23311121]
    expect: included
    why: '"WRKY1 DAP-1" is DAP-seq replicate 1, not 1 day after pollination (PRJNA930480).'
  - id: dap-other-species-dna
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR12341135, SRR12341138, SRR13483050]
    expect: excluded
    reason_class: species
    why: >-
      Arabidopsis studies with DAP-seq on tomato, Marchantia or lambda DNA; the reads belong
      to the other genome (PRJNA649293, PRJNA693252).
  - id: dap-gro-seq-in-dap-study
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [SRR27821903, SRR27821905]
    expect: excluded
    reason_class: assay
    why: GRO-seq runs filed under a DAP-seq study (PRJNA1065964), strategy OTHER like its DAP runs.
  - id: dap-days-after-pollination-lowercase
    species: Arabidopsis_thaliana
    workflow: dap-seq
    runs: [ERR2809794]
    expect: excluded
    reason_class: assay
    why: '"at_6_dap_1" is a seed 6 days after pollination (PRJEB25745).'
  - id: dap-two-read-lengths
    species: Sorghum_bicolor
    workflow: dap-seq
    runs: [SRR9586704, SRR9586709]
    expect: included
    why: >-
      PRJNA550273 sequenced GST-MSD1 at 75 and 100 bp; each is its own library (uniform read
      length within each file), not runs of one library.
  - id: scatac-interleaved-instruments
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR38507144, SRR38507142]
    expect: excluded
    reason_class: files
    why: >-
      Each SRA run interleaves MiSeq and NovaSeq reads whose barcodes read in opposite
      orientations; the workflow sets one orientation from the first reads (SRP699388).
  - id: rna-paired-served-as-one-file
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR20079009, SRR20079006]
    expect: excluded
    reason_class: files
    why: ENA lists the run as PAIRED but serves one file holding both mates in two blocks.
  - id: rna-single-cell-in-bulk
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR9618710]
    expect: excluded
    reason_class: assay
    why: Labelled RNA-Seq, but read 1 holds only the cell barcode.
  - id: rna-other-assays-behind-underscores
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR12272506, SRR26414733]
    expect: excluded
    reason_class: assay
    why: >-
      QuantSeq and m6A IP runs whose titles put the assay after an underscore; a `\b`
      regex misses them (underscore is a word character).
  - id: rna-pat-seq-labelled-rna-seq
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR9963123, SRR21002258, SRR9644762]
    expect: excluded
    reason_class: assay
    why: >-
      PAT-seq (poly(A) tail sequencing) submitted with library strategy RNA-Seq; only the
      experiment title says PAT-seq (PRJNA559744, PRJNA866703, PRJNA552176). Gold before
      2026-11-18 kept them.
  - id: rna-line-expressing-foreign-gene
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR27860459, SRR16018171]
    expect: excluded
    reason_class: genotype
    why: >-
      Col-0 lines expressing a rust effector or a cotton gene; the genotype field says Col-0
      and only the title names the transgene (PRJNA1072118, PRJNA765119).
  - id: rna-control-and-treated-runs-share-a-sample
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR25112175, SRR25112184, SRR25112185]
    expect: included
    why: >-
      Control and cold-treated runs share one BioSample; only the experiment titles ("under
      normal conditions" vs "under cold conditions") tell them apart, so each run is
      classified on its own titles (PRJNA990533).
  - id: rna-isolate-names-the-mutant
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR16077900, SRR20354691]
    expect: excluded
    reason_class: genotype
    why: >-
      Genotype says Col-0 (the background) and only the BioSample isolate says "CRISPR
      mutant" or "grp20-1 mutant" (PRJNA766434, PRJNA851744).
  - id: rna-wild-type-field-beats-study-title
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR28624452, SRR32147272, SRR7889748]
    expect: included
    why: >-
      Experiment titles name the study's mutants, but the sample's genotype or isolate says
      WT while other samples of the study name the mutant (PRJNA1099156, PRJNA1216402,
      PRJNA430092).
  - id: rna-wild-type-field-is-the-background
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR13243757]
    expect: excluded
    reason_class: genotype
    why: >-
      Every sample says genotype WT and every title says "LBD3 inducible over expression
      line": the field gives the background, so the title decides (PRJNA684618).
  - id: rna-smar2c2-labelled-rna-seq
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR18098724, SRR18098725, SRR18098726, SRR18098727]
    expect: excluded
    reason_class: assay
    why: Smar2C2 TSS libraries submitted as RNA-Seq.
  - id: rna-duplicate-submissions
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR26087270]
    expect: excluded
    reason_class: duplicate
    why: >-
      Same reads as SRR26087208 (day 0 of the aphid series), submitted twice. Its twin
      SRR26087269 duplicates an infested sample and is left out for the treatment first.
  - id: atac-low-frip-gsa
    species: Sorghum_bicolor
    workflow: atac-seq
    runs: [CRR145290]
    expect: excluded
    reason_class: qc
    why: >-
      FRiP 0.07 in a full pipeline run (TSS enrichment 2.3 on 200k pairs passed the
      metadata-stage cutoff). Dropped from the gold on 2026-11-18.
  - id: rna-duplicate-keeps-earliest
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR10915190, SRR12426570, SRR28087964]
    expect: excluded
    reason_class: duplicate
    why: >-
      Resubmissions of SRR7447253, SRR8352559 and SRR5040384 (same read count and first reads).
      The earliest accession by number is kept; a string sort keeps SRR10915190 instead.
  - id: rna-duplicate-original-kept
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR7447253, SRR8352559, SRR5040384]
    expect: included
    why: The first submission of each duplicated library stays in the sheet.
  - id: rna-study-title-names-mutants
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR27054271]
    expect: included
    why: >-
      The experiment title says "RNAseq of rog mutants" for the whole study, but the sample
      title (Col0_cont-rep3) names the reference; a study-level word does not flag the sample.
  - id: rna-10x-and-chromatin-in-titles
    species: Arabidopsis_thaliana
    workflow: rna-seq
    runs: [SRR37749403, SRR3352580]
    expect: included
    why: >-
      "control for 10X tpp-KO" (a fold change, not 10x Genomics) and "chromatin interaction
      network" (the study topic, not chromatin-bound RNA) are bulk RNA-seq.
  - id: scatac-library-split-over-experiments
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR31441069, SRR31441070, SRR31441071, SRR31441072]
    expect: included
    fields: {library: 'SRR31441069,SRR31441070,SRR31441071,SRR31441072'}
    why: >-
      One 10x library's four sample-index lanes submitted as four experiments (atsht_S1..S4)
      of one BioSample; they share most cell barcodes, so they are one row (SRP546921).
  - id: scatac-shared-biosample-separate-libraries
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR24921616, SRR24921615]
    expect: included
    fields: {chemistry: 10x-multiome-atac, barcode_whitelist: '-'}
    why: >-
      Four libraries (control and case, two replicates) share one BioSample; their titles
      differ by more than a lane, so they stay separate rows (SRP443792).
  - id: scatac-case-without-control-marker
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR24921614, SRR24921613]
    expect: excluded
    reason_class: treatment
    why: '"case" libraries lack the control marker of the study''s other titles (SRP443792).'
  - id: scatac-bam-resubmission
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR14420340]
    expect: excluded
    reason_class: files
    why: >-
      The same library as SRX16219133 (same BioSample and spot count), first submitted as
      a BAM without the barcode read (SRP318614).
  - id: scatac-fastq-of-bam-resubmission
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR20184262]
    expect: included
    fields: {chemistry: 10x-atac-v1, barcode_whitelist: 737K-cratac-v1.txt}
    why: The FASTQ resubmission of SRP318614's root library has the 16-base barcode read.
  - id: scatac-mixed-species-pool
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR38507152, SRR38507145]
    expect: excluded
    reason_class: species
    why: >-
      Brassicaceae nuclei pooled from four species (taxon "Brassicaceae sp."); found only
      through the study of the A. thaliana libraries (SRP699388).
  - id: scatac-cut-and-tag-with-10x-reads
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR37841656, SRR37841654]
    expect: excluded
    reason_class: assay
    why: snCUT&Tag libraries submitted as ATAC-seq with 10x read structures (SRP686456).
  - id: scatac-sci-atac-no-barcode-read
    species: Arabidopsis_thaliana
    workflow: scatac-reads
    runs: [SRR15662872]
    expect: excluded
    reason_class: files
    why: sci-ATAC-seq reads (150,150) carry no 10x barcode read (SRP334576).
  - id: scatac-genotype-from-paper
    species: Sorghum_bicolor
    workflow: scatac-reads
    runs: [SRR26989943, SRR26989999]
    expect: included
    fields: {chemistry: 10x-multiome-atac}
    why: >-
      SRA gives no genotype for SRP474955; the paper's Methods give BTx623
      (data/scatac.yaml). Time point 0 h of de-etiolation is the untreated sample.
  - id: scatac-light-time-course
    species: Sorghum_bicolor
    workflow: scatac-reads
    runs: [SRR26989939, SRR26990003]
    expect: excluded
    reason_class: treatment
    why: 12 h of light (de-etiolation) is a treatment; only titles say so (SRP474955).
  - id: tss-unsupported-5p-methods
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [SRR6967084, SRR8618705, SRR10742174]
    expect: excluded
    reason_class: assay
    why: >-
      nanoPARE reads 5' ends of capped and uncapped RNA, and NAD captureSeq maps NAD-capped
      RNA; neither is 5' cap TSS mapping (SRP139061, SRP186779, SRP238264).
  - id: tss-cap-less-controls
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [DRR098888, DRR098889, DRR098890, DRR098891]
    expect: excluded
    reason_class: control
    why: The "Cap_less" libraries of the cap-trapping study have no cap selection (DRP003990).
  - id: tss-other-libraries-in-tss-studies
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [DRR221901, SRR27227832, SRR10030449]
    expect: excluded
    reason_class: assay
    why: >-
      RNA-seq and small RNA runs inside TSS studies, and a run the archive marks as CAGE
      selection in an RNA-seq study, are not TSS libraries (DRP008419, SRP478307, SRP219510).
  - id: tss-resubmitted-library
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [SRR7772723]
    expect: excluded
    reason_class: duplicate
    why: Col0_RT in SRP159234 has the same reads as Col0 rep1 (SRR7064004) in SRP142625.
  - id: tss-same-title-not-duplicate
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [DRR095710]
    expect: included
    fields: {method: TSS-seq}
    why: >-
      Same title as DRR072208 ("TSS_seq in WT_Dark_0h") but a different sample, instrument and
      depth (231M vs 125M reads); a matching title is not a duplicate. Gold before 2026-11-18
      left it out.
  - id: tss-trim-and-adapter
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [SRR10045003]
    expect: included
    fields: {method: CAGE, trim_5p: '9', adapter_3p: TCGTATGCCGTCTTCTGCTTG}
    why: >-
      The CAGE libraries carry a 9 nt 5' linker and the small RNA index adapter; the trim
      that puts the offset mode at -1 is 9 (SRP219883).
  - id: tss-seq-trims
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [DRR072208, SRR7064004]
    expect: included
    fields: {method: TSS-seq}
    why: >-
      Oligo-capping TSS-seq libraries whose 5' linkers (2 and 8 nt) must be trimmed so read
      starts fall on annotated TSSs (DRP004481, SRP142625).
  - id: tss-reference-cell-line-and-light-time
    species: Arabidopsis_thaliana
    workflow: tss-seq
    runs: [DRR098884, SRR27227855]
    expect: included
    why: >-
      T87 cells are a Col-0 derived line, and "26h light" is a germination time point, not a
      light treatment (DRP003990, SRP478307).
  - id: atac-photoperiod-is-not-treatment
    species: Arabidopsis_thaliana
    workflow: atac-seq
    runs: [ERR6351833, ERR6351834, ERR6351835]
    expect: included
    why: >-
      The sample protocol states the growth photoperiod ("16 hr light") and a kit name with
      "Index"; neither is a treatment (bare light/dark and "dex" inside a word misfire).
  - id: atac-treatment-only-in-sample-alias
    species: Arabidopsis_thaliana
    workflow: atac-seq
    runs: [SRR13131332, SRR13131333]
    expect: excluded
    reason_class: treatment
    why: >-
      Cold-treatment runs (PRJNA680653) whose titles say only "4C"; the sample alias
      (ATACseq_Cold_4C_Rep2) names the treatment.
  - id: atac-controls-and-single-cell
    species: Sorghum_bicolor
    workflow: atac-seq
    runs: [SRR8742452, SRR27500249, SRR27704580]
    expect: excluded
    reason_class: assay
    why: >-
      An input control (TSS enrichment 0.98), sci-ATAC plates and a single-cell library
      source inside the ENA ATAC-seq search.
  - id: atac-gsa-runs-from-tab
    species: Sorghum_bicolor
    workflow: atac-seq
    runs: [CRR145291, SRR5748780]
    expect: included
    fields: {layout: paired}
    why: >-
      Runs only the metadata-sheet tab lists: a GSA run (files on a GSA download server,
      mates named _f1/_r2) and an INSDC run submitted as Tn-Seq.
  - id: rna-growth-protocol-names-a-deficit
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR15558345, SRR15558350]
    expect: excluded
    reason_class: treatment
    why: >-
      BioSample treatment says "No treatment" while growth_protocol says "Phosphorous
      deficit" or "Nitrogen deficit" (PRJNA746310, aliases Sorghum_Pdep and Sorghum_Ndep).
  - id: rna-stage-after-infestation
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR26087204, SRR26087207]
    expect: excluded
    reason_class: treatment
    why: >-
      The only treatment is in dev_stage: "4 days after aphid infestation" (PRJNA1009505).
  - id: rna-bare-mt-genotype
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR37195612, SRR37195621]
    expect: excluded
    reason_class: genotype
    why: >-
      Genotype "MT" beside "WT" samples of the same study, cultivar BTx623 (PRJNA1419276).
  - id: rna-cross-with-asterisk
    species: Sorghum_bicolor
    workflow: rna-seq
    runs: [SRR3707897]
    expect: excluded
    reason_class: genotype
    why: Cultivar "Tx623*SV", a near-isogenic line from a cross (PRJNA325381).
